services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pan
      POSTGRES_PASSWORD: pan
      POSTGRES_DB: pan
    ports:
      - "5432:5432"
    volumes:
      - pan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pan -d pan"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pan:pan@db:5432/pan
      JWT_SECRET: dev-secret-change-me-to-32-characters
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin-pass-123
      COOKIE_SECURE: "false"
      AUTO_CREATE_TABLES: "false"
      COOKIE_FERNET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://pan:pan@db:5432/pan
      JWT_SECRET: dev-secret-change-me-to-32-characters
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin-pass-123
      COOKIE_SECURE: "false"
      AUTO_CREATE_TABLES: "false"
      COOKIE_FERNET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    depends_on:
      db:
        condition: service_healthy

volumes:
  pan_pg:
